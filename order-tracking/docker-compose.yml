services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orders:orders@db:5432/orders
      # Без Keycloak. Для входу через Keycloak — KEYCLOAK_* / PUBLIC_URL / SESSION_SECRET (див. .env.example).
      AUTH_DISABLED: "true"
      NODE_ENV: development   # AUTH_DISABLED при production заборонено
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:
