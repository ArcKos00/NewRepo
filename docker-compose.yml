services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orders:orders@db:5432/orders
      # Без Keycloak (усе від dev-користувача). З Keycloak — KEYCLOAK_* / PUBLIC_URL / SESSION_SECRET,
      # див. apps/api/.env.example, або запуск для розробки через docker-compose.dev.yml.
      AUTH_DISABLED: "true"
      NODE_ENV: development   # AUTH_DISABLED при production заборонено
      # Трейси/логи/метрики в Elastic APM (або OTel Collector). Порожньо — вимкнено.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:
