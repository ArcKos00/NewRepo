# =============================================================================
# Purchase (order-tracking) — Kubernetes deployment
# -----------------------------------------------------------------------------
# Підстановка змінних — та сама, що й в інших сервісах: Jenkins підставляє ${NAMESPACE},
# ${REPOSITORY} і ${IMAGE_TAG}; застосувати, наприклад:
#     envsubst < deploy.yaml | kubectl apply -f -
# Ім'я сервісу (purchase) і хост (purchase.gov.kub.k2.lan) задані тут явно.
#
# Оновлення без простою працює ЛИШЕ через RollingUpdate Deployment-а (maxSurge 1, maxUnavailable 0).
# Тобто кожен деплой має міняти pod template:
#   * унікальний ${IMAGE_TAG} на кожну збірку (imagePullPolicy IfNotPresent + той самий тег =
#     apply нічого не змінює, а старий образ на вузлі лишається старим);
#   * якщо тег той самий — `kubectl -n ${NAMESPACE} rollout restart deploy/purchase`.
#
# Один образ (order-tracking/Dockerfile) і один контейнер: NestJS на порту 3000 віддає /api/* і роздає
# зібраний фронт (apps/web/dist). Схему БД застосунок накочує сам на старті (TypeORM migrationsRun).
#
# Секрет purchase-secret створюється руками, у yaml його немає. БД — окремий інстанс на local.storage:
#     kubectl -n ${NAMESPACE} create secret generic purchase-secret \
#       --from-literal=DATABASE_URL='postgres://purchase:<пароль>@local.storage:5437/purchase'
#
# Вкладені файли (скани договорів/накладних) лежать на PVC purchase-uploads (RWO). Том RWO, тож
# RollingUpdate працює через podAffinity до власного вузла (див. Deployment).
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: purchase-config
  namespace: ${NAMESPACE}
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Вкладені файли — на PVC (див. volumes нижче).
  UPLOADS_DIR: "/app/data/uploads"
  # Максимальний розмір одного файлу, МБ.
  MAX_UPLOAD_MB: "50"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: purchase-uploads
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: ""   # задати, якщо в кластері немає default StorageClass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase
  namespace: ${NAMESPACE}
  labels:
    app: purchase
spec:
  # Одна репліка свідомо: файли — на RWO-томі.
  replicas: 1
  revisionHistoryLimit: 1
  # Скільки новий под має бути Ready, перш ніж старий отримає SIGTERM.
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  # RollingUpdate без простою: новий под піднімається поруч (maxSurge 1), старий живе, доки новий
  # не стане ready (maxUnavailable 0). Том — ReadWriteOnce, тому нижче podAffinity прибиває новий
  # под до вузла, де вже працює старий: на одному вузлі RWO-том монтується обома.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: purchase
  template:
    metadata:
      labels:
        app: purchase
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAffinity:
          # Новий под — на той самий вузол, що і поточний (спільний RWO-том). Для першого пода
          # правило до власного лейбла вважається виконаним. Наслідок: при drain вузла под не
          # переїде сам — на час обслуговування вузла деплой поводиться як Recreate.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: purchase
      securityContext:
        # користувач node (uid 1000) з базового образу
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: purchase-uploads
      initContainers:
        # Новий том створюється root:root — віддати його uid 1000, інакше застосунок не зможе писати файли.
        - name: fix-permissions
          image: "${REPOSITORY}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: uploads
              mountPath: /data
      containers:
        - name: purchase
          image: "${REPOSITORY}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: purchase-config
            - secretRef:
                name: purchase-secret         # DATABASE_URL
          env:
            # Стеля V8-heap (~75 % від limits.memory), щоб Node не брав дефолт з розміру ноди.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
          ports:
            - name: http
              containerPort: 3000
          # Окремих health-ендпоінтів у застосунку немає. Порт починає слухати лише після підключення
          # до БД і прогону міграцій, тож startup/liveness — статичний `/` (index.html, без БД), а
          # readiness — легкий запит у БД (список контрагентів): без БД под краще тримати поза Service.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/contracts/counterparties
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Видалення з Endpoints і SIGTERM ідуть паралельно — пауза дає haproxy
                # побачити под вибулим, інакше кожен деплой роняє кілька запитів.
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: purchase
  namespace: ${NAMESPACE}
  labels:
    app: purchase
spec:
  type: ClusterIP
  selector:
    app: purchase
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: purchase
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: k2-intermediate-issuer
    # Завантаження файлів (до MAX_UPLOAD_MB) на повільному каналі не має рватися дефолтним таймаутом.
    haproxy.org/timeout-server: "300s"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - purchase.gov.kub.k2.lan
      secretName: purchase-tls-secret
  rules:
    - host: purchase.gov.kub.k2.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: purchase
                port:
                  name: http
